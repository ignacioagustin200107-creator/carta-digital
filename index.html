<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#b5541c" id="themeColor">
<title>Demo Carta Digital – Hamburguesería</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" id="gf" href="">
<style>
/* =========================================================
   MOTOR DE ESTILOS
   - Variables de color/letra/forma  -> :root (las pone JS)
   - Personalidad (formato)          -> body.fmt-*
   - Efecto de tarjetas              -> body.card-*
   - Distribución                    -> body.layout-*
   ========================================================= */
:root{
  --pri:#b5541c;--bg:#f4ede1;--card:#fffaf2;--txt:#3b2a1a;--onpri:#fff;--r:16px;
  --fb:system-ui,sans-serif;--ft:system-ui,sans-serif;
  --muted:color-mix(in srgb,var(--txt) 62%,transparent);
  --line:color-mix(in srgb,var(--txt) 13%,transparent);
  --pri-soft:color-mix(in srgb,var(--pri) 14%,transparent);
  --ease:cubic-bezier(.2,.85,.25,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--fb);-webkit-font-smoothing:antialiased;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));transition:background-color .35s,color .35s;min-height:100vh;overflow-x:clip}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none}
h1,h2,h3,.precio{font-family:var(--ft)}
img{display:block;max-width:100%}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.wrap{max-width:920px;margin:0 auto;padding:0 16px}

/* ---------- HERO (base) ---------- */
.hero{position:relative;text-align:center}
.hero-bg{display:none}
.hero-in{position:relative;z-index:1;padding:34px 16px 26px;max-width:920px;margin:0 auto}
.logo{width:88px;height:88px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;font-size:46px;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.kicker{font-size:11px;letter-spacing:.32em;text-transform:uppercase;opacity:.85;margin-bottom:6px;font-weight:600}
.hero h1{font-size:clamp(28px,7.6vw,46px);line-height:1.05}
.slogan{margin-top:8px;opacity:.92;font-size:15px}
.meta{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px;font-size:13px}
.meta span{padding:6px 12px;border-radius:999px}

/* ---------- PROMO (base) ---------- */
.promo{margin:18px 0 4px;border-radius:var(--r);padding:16px 18px;display:flex;gap:14px;align-items:center;position:relative;overflow:hidden;
  background:linear-gradient(120deg,var(--pri),color-mix(in srgb,var(--pri) 62%,#000));color:var(--onpri);
  box-shadow:0 14px 30px -14px var(--pri)}
.promo::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.28) 50%,transparent 65%);
  transform:translateX(-100%);animation:shine 3.8s ease-in-out infinite}
.promo .pe{font-size:38px;animation:bob 2.6s ease-in-out infinite;flex:none}
.promo .tag{display:inline-block;font:800 10px/1 var(--fb);letter-spacing:.14em;padding:4px 7px;border-radius:6px;background:rgba(255,255,255,.22);margin-bottom:5px}
.promo h2{font-size:19px;line-height:1.15}
.promo p{font-size:14px;margin-top:3px;opacity:.95}

/* ---------- NAV: buscador + categorías ---------- */
.nav{position:sticky;top:0;z-index:20;margin:0 -16px;padding:12px 16px 10px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3)}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:10px 15px;margin-bottom:10px}
.search input{border:none;outline:none;background:transparent;color:var(--txt);font:inherit;font-size:16px;flex:1;min-width:0}
.search input::placeholder{color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 15px;border-radius:999px;font-size:14px;font-weight:600;white-space:nowrap;border:1.5px solid var(--pri);
  color:var(--pri);background:transparent;transition:background .25s,color .25s,box-shadow .25s,transform .15s}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--pri);color:var(--onpri)}

/* ---------- SECCIONES ---------- */
section.cat{padding-top:20px;scroll-margin-top:122px}
.cat-h{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:22px}
.cat-h .n{font:600 13px var(--fb);color:var(--muted)}
.empty{text-align:center;padding:40px 10px;color:var(--muted);display:none}

/* ---------- PRODUCTOS ---------- */
.items{display:grid;gap:14px}
.item{position:relative;border-radius:var(--r);overflow:hidden;cursor:pointer;color:var(--txt);display:flex;flex-direction:column;outline:none;
  transition:transform .3s var(--ease),box-shadow .3s var(--ease),background-color .35s;-webkit-tap-highlight-color:transparent}
.item:active{transform:scale(.965)}
.item:focus-visible{outline:2px solid var(--pri);outline-offset:3px}
@media(hover:hover){
  .item:hover{transform:translateY(-4px)}
  .item:hover .foto img,.item:hover .foto .em{transform:scale(1.07)}
}
.foto{position:relative;aspect-ratio:4/3;overflow:hidden;display:grid;place-items:center;flex:none;
  background:radial-gradient(circle at 30% 22%,color-mix(in srgb,var(--pri) 55%,#fff),var(--pri) 55%,color-mix(in srgb,var(--pri) 55%,#000))}
.foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease)}
.foto .em{font-size:56px;filter:drop-shadow(0 10px 10px rgba(0,0,0,.3));transition:transform .6s var(--ease)}
.info{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.info h3{font-size:16.5px;line-height:1.2}
.info p{font-size:13.5px;line-height:1.4;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr{margin-top:auto;padding-top:6px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.precio{font-weight:800;color:var(--pri);font-size:18px}
.antes{color:var(--muted);font-size:13px}
.go{display:none}
.item.agotado{filter:grayscale(.9);opacity:.58}

/* Distintivos */
.badges{position:absolute;top:9px;left:9px;right:9px;z-index:2;display:flex;flex-wrap:wrap;gap:5px;pointer-events:none}
.info .badges{position:static;margin-bottom:3px}
.bd{font:800 11px/1 var(--fb);padding:5px 9px;border-radius:999px;white-space:nowrap}
.bd-dest{background:linear-gradient(110deg,#ffc928 30%,#fff4bf 50%,#ffc928 70%);background-size:250% 100%;color:#3a2a00;
  animation:shimmer 2.6s linear infinite;box-shadow:0 4px 14px rgba(255,180,0,.45)}
.bd-off{background:#ff2d55;color:#fff;box-shadow:0 4px 14px rgba(255,45,85,.5);animation:pulse 1.8s ease-in-out infinite}
.bd-sin{background:rgba(0,0,0,.78);color:#fff}

/* ---------- EFECTOS DE TARJETA ---------- */
.card-sombra .item{background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.05),0 10px 26px -10px rgba(0,0,0,.22)}
@media(hover:hover){.card-sombra .item:hover{box-shadow:0 2px 4px rgba(0,0,0,.05),0 22px 40px -14px rgba(0,0,0,.3)}}
.card-neumorfismo .item{background:var(--bg);
  box-shadow:7px 7px 16px color-mix(in srgb,var(--bg) 72%,#000),-7px -7px 16px color-mix(in srgb,var(--bg) 60%,#fff)}
.card-neumorfismo .item:active{box-shadow:inset 5px 5px 12px color-mix(in srgb,var(--bg) 72%,#000),inset -5px -5px 12px color-mix(in srgb,var(--bg) 60%,#fff)}
.card-neumorfismo .item .foto{margin:9px 9px 0;border-radius:calc(var(--r) - 4px)}
.card-vidrio .item{background:color-mix(in srgb,var(--card) 52%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5);
  border:1px solid color-mix(in srgb,#fff 40%,transparent);box-shadow:0 10px 32px -10px rgba(0,0,0,.25)}
.card-borde .item{background:var(--card);border:1px solid var(--line)}

/* ---------- DISTRIBUCIÓN ---------- */
.layout-grilla .items{grid-template-columns:repeat(auto-fill,minmax(155px,1fr))}
.layout-grilla .info h3{font-size:15.5px}
.layout-grande .items{grid-template-columns:1fr}
.layout-grande .items .foto{aspect-ratio:16/10}
.layout-grande .items .foto .em{font-size:86px}
.layout-lista .items{grid-template-columns:1fr}
.layout-lista .items .bd{font-size:10px;padding:4px 7px}
.layout-lista .item{flex-direction:row;min-height:118px}
.layout-lista .items .foto{width:120px;aspect-ratio:auto}
.layout-lista .items .foto .em{font-size:42px}
.layout-lista.card-neumorfismo .item .foto{margin:9px 0 9px 9px}
@media(min-width:640px){.layout-grande .items,.layout-lista .items{grid-template-columns:1fr 1fr}}

/* =========================================================
   PERSONALIDADES (FORMATOS)
   ========================================================= */

/* ---- CLÁSICO: cálido, parrilla, encabezado curvo ---- */
.fmt-clasico .hero{background:var(--pri);color:var(--onpri);padding-bottom:22px;overflow:hidden}
.fmt-clasico .hero::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-36px;height:60px;background:var(--bg);border-radius:50% 50% 0 0}
.fmt-clasico .logo{background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.55);box-shadow:0 12px 30px rgba(0,0,0,.22)}
.fmt-clasico .meta span{background:rgba(0,0,0,.18)}
.fmt-clasico .promo{background:var(--card);color:var(--txt);border:2px dashed var(--pri);box-shadow:none}
.fmt-clasico .promo h2{color:var(--pri)}
.fmt-clasico .promo .tag{background:var(--pri);color:var(--onpri)}
.fmt-clasico .cat-h::after{content:"";flex:1;height:2px;background:color-mix(in srgb,var(--pri) 28%,transparent)}

/* ---- LUJO: minimalista de alta gama ---- */
.fmt-lujo .hero-in{padding:52px 20px 30px}
.fmt-lujo .logo{width:74px;height:74px;font-size:34px;border:1px solid var(--pri);background:transparent;padding:4px}
.fmt-lujo .logo img{border-radius:50%}
.fmt-lujo .kicker{color:var(--pri);letter-spacing:.5em}
.fmt-lujo .kicker::before,.fmt-lujo .kicker::after{content:"";display:inline-block;width:26px;height:1px;background:var(--pri);vertical-align:middle;margin:0 10px}
.fmt-lujo .hero h1{font-weight:500;letter-spacing:.01em;font-size:clamp(36px,10vw,60px)}
.fmt-lujo .slogan{font-style:italic;color:var(--muted)}
.fmt-lujo .meta span{padding:0 4px;color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.fmt-lujo .hero::after{content:"";display:block;width:56px;height:1px;background:var(--pri);margin:0 auto}
.fmt-lujo .promo{background:transparent;color:var(--txt);border:1px solid var(--pri);box-shadow:none;flex-direction:column;text-align:center;gap:4px;padding:22px}
.fmt-lujo .promo::after{display:none}
.fmt-lujo .promo h2{font-weight:500;font-size:24px;color:var(--pri)}
.fmt-lujo .promo .tag{background:none;color:var(--muted);letter-spacing:.35em}
.fmt-lujo .promo .pe{font-size:28px;animation:none}
.fmt-lujo .search{background:transparent;border:none;border-bottom:1px solid var(--line);border-radius:0;padding-left:2px}
.fmt-lujo .chip{border:none;border-radius:0;padding:8px 2px;margin-right:14px;color:var(--muted);text-transform:uppercase;font-size:11.5px;letter-spacing:.16em;border-bottom:1px solid transparent}
.fmt-lujo .chip.on{background:none;color:var(--txt);border-bottom-color:var(--pri)}
.fmt-lujo .cat-h{justify-content:center;font-weight:500;font-size:28px;margin:22px 0 20px}
.fmt-lujo .cat-h .n{display:none}
.fmt-lujo .cat-h::before,.fmt-lujo .cat-h::after{content:"";width:28px;height:1px;background:var(--pri)}
.fmt-lujo .items{gap:22px}
.fmt-lujo .item .foto,.fmt-lujo .det .foto{background:color-mix(in srgb,var(--pri) 12%,var(--card))}
.fmt-lujo .foto .em{filter:none}
.fmt-lujo .info{padding:16px}
.fmt-lujo .info h3{font-weight:600;font-size:21px}
.fmt-lujo .precio{font-weight:600;color:var(--txt);font-size:20px}
.fmt-lujo .bd{background:var(--card);color:var(--pri);border:1px solid var(--pri);box-shadow:none;animation:none;font-weight:600;text-transform:uppercase;letter-spacing:.14em;font-size:9.5px;border-radius:0;padding:5px 8px}
.fmt-lujo .bd-off{background:var(--pri);color:var(--onpri)}
@media(hover:hover){.fmt-lujo .item:hover{transform:none}}

/* ---- NOCHE: moderno, alto contraste, neón ---- */
body.fmt-noche::before{background:radial-gradient(70% 45% at 50% -5%,color-mix(in srgb,var(--pri) 38%,transparent),transparent 70%)}
.fmt-noche .hero h1{text-transform:uppercase;letter-spacing:.06em;text-shadow:0 0 26px color-mix(in srgb,var(--pri) 75%,transparent)}
.fmt-noche .kicker{color:var(--pri)}
.fmt-noche .logo{background:var(--card);box-shadow:0 0 0 2px var(--pri),0 0 34px color-mix(in srgb,var(--pri) 65%,transparent)}
.fmt-noche .meta span{border:1px solid var(--line);background:color-mix(in srgb,var(--card) 70%,transparent)}
.fmt-noche .promo{background:var(--card);color:var(--txt);border:1px solid var(--pri);box-shadow:0 0 36px -8px color-mix(in srgb,var(--pri) 70%,transparent)}
.fmt-noche .promo h2{color:var(--pri);text-transform:uppercase;letter-spacing:.04em}
.fmt-noche .promo .tag{background:var(--pri);color:var(--onpri)}
.fmt-noche .chip{border:1px solid var(--line);color:var(--txt);background:var(--card)}
.fmt-noche .chip.on{background:var(--pri);color:var(--onpri);border-color:var(--pri);box-shadow:0 0 20px color-mix(in srgb,var(--pri) 65%,transparent)}
.fmt-noche .cat-h{text-transform:uppercase;letter-spacing:.06em}
.fmt-noche .cat-h::before{content:"";width:4px;height:22px;border-radius:4px;background:var(--pri);box-shadow:0 0 14px var(--pri)}
.fmt-noche .info h3{text-transform:uppercase;letter-spacing:.03em}
.fmt-noche .item.dest{box-shadow:0 0 0 1px var(--pri),0 0 30px -6px var(--pri)}
.fmt-noche .bd-dest{background:var(--pri);color:var(--onpri);animation:glow 2s ease-in-out infinite;box-shadow:0 0 16px var(--pri)}

/* ---- DELIVERY: estilo app, dinámico ---- */
.fmt-delivery .hero{text-align:left}
.fmt-delivery .hero-bg{display:block;height:150px;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--pri),color-mix(in srgb,var(--pri) 58%,#000))}
.fmt-delivery .hero-bg::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.08) 0 14px,transparent 14px 28px)}
.fmt-delivery .hero-in{margin:-58px 14px 0;background:var(--card);border-radius:calc(var(--r) + 6px);padding:16px;display:grid;grid-template-columns:auto 1fr;gap:2px 14px;align-items:center;
  box-shadow:0 16px 34px -14px rgba(0,0,0,.3)}
@media(min-width:950px){.fmt-delivery .hero-in{margin:-58px auto 0;max-width:888px}}
.fmt-delivery .logo{width:66px;height:66px;border-radius:18px;margin:0;font-size:34px;background:var(--pri-soft)}
.fmt-delivery .kicker{display:none}
.fmt-delivery .hero h1{font-size:23px}
.fmt-delivery .slogan{font-size:13px;color:var(--muted);margin-top:3px}
.fmt-delivery .meta{grid-column:1/-1;justify-content:flex-start;margin-top:12px;gap:6px}
.fmt-delivery .meta span{background:var(--bg);font-size:12px;padding:6px 10px;font-weight:600}
.fmt-delivery .search{border:none;box-shadow:0 2px 10px -2px rgba(0,0,0,.12);border-radius:14px}
.fmt-delivery .chip{border:none;background:var(--card);color:var(--txt);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.fmt-delivery .chip.on{background:var(--txt);color:var(--bg)}
.fmt-delivery .cat-h{font-size:20px;font-weight:800}
.fmt-delivery .info h3{font-weight:700}
.fmt-delivery .go{display:grid;place-items:center;position:absolute;right:10px;bottom:10px;width:34px;height:34px;border-radius:50%;z-index:2;
  background:var(--pri);color:var(--onpri);font:700 22px/1 var(--fb);box-shadow:0 6px 16px -4px var(--pri);transition:transform .2s}
.fmt-delivery .item:active .go{transform:scale(1.2)}
.fmt-delivery.layout-lista .item{flex-direction:row-reverse}
.fmt-delivery.layout-lista .items .foto{width:116px;margin:10px;border-radius:calc(var(--r) - 4px)}
.fmt-delivery.layout-lista .info{padding-right:4px}
.fmt-delivery .bd-dest{background:#fff;color:#111;animation:none;box-shadow:0 2px 8px rgba(0,0,0,.18)}

/* ---- CRISTAL: glassmorphism vibrante ---- */
body.fmt-cristal::before{background:
  radial-gradient(42% 32% at 8% 6%,color-mix(in srgb,var(--pri) 70%,transparent),transparent 70%),
  radial-gradient(45% 38% at 96% 26%,color-mix(in srgb,var(--pri) 40%,#ec4899 45%),transparent 70%),
  radial-gradient(55% 40% at 25% 92%,color-mix(in srgb,var(--pri) 30%,#06b6d4 50%),transparent 70%)}
.fmt-cristal .hero-in{margin:18px auto 0;max-width:min(560px,calc(100% - 28px));background:color-mix(in srgb,var(--card) 45%,transparent);
  -webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);border:1px solid rgba(255,255,255,.45);
  border-radius:calc(var(--r) + 10px);box-shadow:0 14px 40px -12px rgba(0,0,0,.2)}
.fmt-cristal .logo{background:rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.65)}
.fmt-cristal .kicker{color:var(--pri)}
.fmt-cristal .meta span{background:rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.5)}
.fmt-cristal .nav{background:color-mix(in srgb,var(--bg) 40%,transparent)}
.fmt-cristal .search{background:color-mix(in srgb,var(--card) 50%,transparent);border-color:rgba(255,255,255,.5)}
.fmt-cristal .chip{background:rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.55);color:var(--txt)}
.fmt-cristal .chip.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}

/* ---------- DETALLE (hoja inferior con transición desde la tarjeta) ---------- */
.ov{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,0);transition:background-color .3s}
.ov.open{display:flex}
.ov.show{background:rgba(0,0,0,.55)}
.det{position:relative;background:var(--card);color:var(--txt);font-family:var(--fb);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;overscroll-behavior:contain;
  border-radius:calc(var(--r) + 12px) calc(var(--r) + 12px) 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.25);will-change:transform}
@media(min-width:600px){.ov{align-items:center}.det{border-radius:calc(var(--r) + 12px)}}
.det .foto{aspect-ratio:16/11}
.det .foto .em{font-size:100px}
.det .handle{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:42px;height:5px;border-radius:9px;background:rgba(255,255,255,.75);z-index:3}
.det .badges{top:22px}
.det .body{padding:20px 20px calc(22px + env(safe-area-inset-bottom))}
.det h2{font-size:26px;line-height:1.15}
.det p.d{color:var(--muted);margin:8px 0 14px;line-height:1.5}
.det .precio{font-size:28px}
.det .ahorro{display:inline-block;margin-top:6px;font:700 13px var(--fb);color:#ff2d55}
.det .nostock{margin-top:10px;font-weight:700}
.det .cerrar{margin-top:18px;width:100%;padding:15px;border:none;border-radius:var(--r);background:var(--pri);color:var(--onpri);font-weight:700;font-size:15px}
.fmt-lujo .det .cerrar{background:transparent;color:var(--txt);border:1px solid var(--txt);text-transform:uppercase;letter-spacing:.2em;font-size:12px}

footer{text-align:center;padding:34px 16px;font-size:12.5px;color:var(--muted)}

/* ---------- ANIMACIONES ---------- */
.rv:not(.in){opacity:0}
.rv.in{animation:rise .55s var(--ease) backwards}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
@keyframes shine{0%,55%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
@keyframes bob{50%{transform:translateY(-4px) rotate(-6deg)}}
@keyframes shimmer{to{background-position:-250% 0}}
@keyframes pulse{50%{transform:scale(1.08)}}
@keyframes glow{50%{box-shadow:0 0 4px var(--pri)}}
body.noanim #app *,body.noanim .ov *{animation:none!important;transition:none!important}
body.noanim .rv{opacity:1}
@media(prefers-reduced-motion:reduce){#app *,.ov *{animation:none!important;transition:none!important}.rv{opacity:1}}

/* =========================================================
   PANEL DEL DUEÑO (estilo propio, no cambia con el formato)
   ========================================================= */
.adm{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1d1d1f}
.fab.adm,.demo-tag.adm,.toast.adm{color:#fff}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:40;background:#111;border:none;border-radius:999px;padding:13px 18px;font-weight:600;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.demo-tag{position:fixed;left:12px;bottom:calc(22px + env(safe-area-inset-bottom));z-index:40;background:rgba(0,0,0,.72);font-weight:700;font-size:11px;padding:5px 9px;border-radius:6px;letter-spacing:1px}
.login-ov{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center}
.login-ov.open{display:flex}
.login{background:#fff;border-radius:18px;padding:24px;width:min(340px,92%);text-align:center}
.login h3{font-size:19px;margin-bottom:6px}
.login input{width:100%;font-size:22px;text-align:center;letter-spacing:8px;padding:10px;border:1.5px solid #ccc;border-radius:10px;margin:14px 0 8px}
.login .err{color:#d00;font-size:13px;min-height:18px}
.btn{border:none;border-radius:10px;padding:11px 14px;font-weight:600;font-size:14px;background:#111;color:#fff}
.btn.sec{background:#eee;color:#111}
.btn.dan{background:#fdecec;color:#c00}
.btn.full{width:100%}
.mini{font-size:12.5px;padding:8px 10px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:#f6f6f8;z-index:60;box-shadow:-10px 0 40px rgba(0,0,0,.25);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .3s ease}
.drawer.open{transform:none}
.dh{background:#111;color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
.dh h3{flex:1;font-size:16px}
.dh button{background:#333;color:#fff;border:none;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600}
.tabs{display:flex;background:#fff;border-bottom:1px solid #e3e3e6}
.tabs button{flex:1;min-width:0;border:none;background:none;padding:8px 2px;font-size:11.5px;font-weight:600;color:#777;border-bottom:3px solid transparent;
  display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.15}
.tabs .ti{font-size:17px;line-height:1}          /* ícono arriba */
.tabs .tt{white-space:nowrap}                     /* texto abajo: entran 5 tabs en 320px */
.tabs button.on{color:#111;border-color:#111}
.dbody{flex:1;overflow-y:auto;padding:16px;overscroll-behavior:contain}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;border:1px solid #ececf0}
.card h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.6px;color:#888;margin-bottom:10px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.field:last-child{margin-bottom:0}
.field label{font-size:13px;font-weight:600;color:#444}
.field input[type=text],.field input[type=number],.field input[type=tel],.field input[type=url],.field textarea,.field select{font:inherit;font-size:15px;padding:9px 11px;border:1.5px solid #ddd;border-radius:9px;background:#fff;width:100%;color:#111}
.field textarea{resize:vertical;min-height:60px}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.colors{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.colors label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:#444;background:#f6f6f8;padding:6px 8px;border-radius:9px}
.colors input{width:34px;height:34px;border:none;background:none;padding:0}
.temas{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tema{border:2px solid #e3e3e6;border-radius:12px;padding:9px 10px;background:#fff;text-align:left;display:flex;flex-direction:column;gap:5px}
.tema.on{border-color:#111;box-shadow:0 0 0 2px #111 inset}
.tema .sw{display:flex;gap:4px}
.tema .sw i{width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,.12)}
.tema b{font-size:13px}
.tema code{font-size:10.5px;color:#888}
.seg{display:flex;background:#eee;border-radius:10px;padding:3px;flex-wrap:wrap}
.seg button{flex:1;border:none;background:none;padding:8px 4px;border-radius:8px;font-size:12.5px;font-weight:600;color:#555;min-width:70px}
.seg button.on{background:#fff;color:#111;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.tog{display:flex;align-items:center;justify-content:space-between;padding:6px 0;font-size:14px;font-weight:600;color:#333}
.sw2{position:relative;width:46px;height:27px;flex:none}
.sw2 input{opacity:0;width:0;height:0}
.sw2 span{position:absolute;inset:0;background:#ccc;border-radius:999px;transition:.2s}
.sw2 span::before{content:"";position:absolute;width:21px;height:21px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw2 input:checked+span{background:#22a55b}
.sw2 input:checked+span::before{transform:translateX(19px)}
.code-card{border:2px solid #111}
.code-card textarea{width:100%;font:600 15px ui-monospace,SFMono-Regular,Menlo,monospace;padding:10px 12px;border:1.5px solid #ccc;border-radius:10px;resize:vertical;min-height:58px;color:#111;background:#fafafa}
.code-card textarea:focus{outline:none;border-color:#111;background:#fff}
.fb{margin:8px 0 10px;display:flex;flex-wrap:wrap;gap:5px;min-height:10px}
.fb span{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:6px}
.fb .ok{background:#e7f7ee;color:#137a3e}
.fb .bad{background:#fdecec;color:#c00}
.help{margin-top:10px;font-size:13px;color:#444}
.help summary{cursor:pointer;font-weight:600;color:#111}
.help table{width:100%;border-collapse:collapse;margin-top:8px;font-size:12px}
.help td{padding:5px 4px;border-top:1px solid #eee;vertical-align:top}
.help td:first-child{font-family:ui-monospace,Menlo,monospace;font-weight:700;white-space:nowrap}
.help p{margin-top:8px;line-height:1.45}
.help code{background:#f1f1f3;padding:1px 5px;border-radius:4px;font-size:12px}
.prod{border:1px solid #ececf0;border-radius:10px;margin-bottom:8px;background:#fff}
.prod summary{list-style:none;padding:10px 12px;display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px}
.prod summary::-webkit-details-marker{display:none}
.prod summary .n{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prod summary .p{color:#666;font-size:13px}
.prod summary .e{font-size:20px}

.tagx{font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;background:#222;color:#fff}
.tagx.of{background:#ff2d55}
.cathead{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.cathead input{font:inherit;font-weight:700;font-size:15px;padding:7px 9px;border:1.5px solid #ddd;border-radius:9px;flex:1;min-width:0}
.cathead input.em{flex:none;width:48px;text-align:center}
.upl{display:flex;gap:8px;align-items:center}
.upl .th{width:48px;height:48px;border-radius:9px;background:#eee;display:grid;place-items:center;overflow:hidden;font-size:24px;flex:none}
.upl .th img{width:100%;height:100%;object-fit:cover}
.upl label.btn{display:inline-block;cursor:pointer}
.upl input[type=file]{display:none}
.hint{font-size:12px;color:#888;margin-top:4px;line-height:1.4}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#111;font-weight:600;font-size:13px;padding:10px 16px;border-radius:999px;opacity:0;transition:.25s;z-index:80;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}

/* ---------- Generador de QR (panel del dueño) ---------- */
.aviso{background:#fff4e0;border:1px solid #f5c26b;color:#8a5a00;border-radius:9px;padding:9px 11px;font-size:13px;line-height:1.4;margin:8px 0 10px}
.aviso b{display:block;margin-bottom:2px}
.qrprev{display:flex;justify-content:center;margin-top:12px}
.qrprev canvas{width:220px;max-width:100%;height:auto;border-radius:3px;box-shadow:0 6px 22px rgba(0,0,0,.16),0 1px 3px rgba(0,0,0,.08)}
.qrvacio{width:100%;border:2px dashed #ccc;border-radius:10px;padding:22px 14px;text-align:center;color:#666;font-size:13px;line-height:1.45}
.qrvacio .btn{margin-top:10px}
.qrbtns{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.qrbtns .btn{flex:1 1 130px}
[data-qr][aria-disabled=true]{opacity:.4;cursor:not-allowed}

/* ---------- Hoja A4 para imprimir QR (se crea al vuelo) ---------- */
#printArea{display:none}
.hoja{position:relative;width:210mm;height:296.5mm;overflow:hidden;background:#fff}
.hoja img{position:absolute;display:block;max-width:none}
.hoja .cab{position:absolute;left:0;right:0;text-align:center;font:7pt/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#888;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8mm}   /* un nombre largo no baja sobre las tarjetas */
.hoja .corte{position:absolute;width:0;height:0;border:0 dashed #999}
.hoja .cv{border-left-width:.2mm}
.hoja .ch{border-top-width:.2mm}
/* Impresión de la hoja de QR: solo mientras body tiene la clase "imprimiendo-qr" (la pone qrImprimir).
   Sin la clase, #printArea queda oculto y la carta se imprime normal.
   El @page A4 sin márgenes va en un <style> dentro de #printArea, así solo existe durante esa impresión. */
@media print{
  body.imprimiendo-qr{background:#fff!important;padding:0!important;margin:0!important;min-height:0!important}
  body.imprimiendo-qr::before{display:none!important}
  body.imprimiendo-qr>*:not(#printArea){display:none!important}
  body.imprimiendo-qr>#printArea{display:block!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<div class="ov" id="detOv"><div class="det" id="det" role="dialog" aria-modal="true"></div></div>

</aside>

<div class="toast adm" id="toast"></div>

<script>
/* =========================================================
   CATÁLOGOS
   ========================================================= */
const FUENTES = {
  Sistema:   {css:"system-ui,-apple-system,'Segoe UI',Roboto,sans-serif", g:null},
  Inter:     {css:"'Inter',system-ui,sans-serif",       g:"Inter:wght@400;600;800"},
  Poppins:   {css:"'Poppins',sans-serif",               g:"Poppins:wght@400;600;700;800"},
  Montserrat:{css:"'Montserrat',sans-serif",            g:"Montserrat:wght@400;600;800"},
  Nunito:    {css:"'Nunito',sans-serif",                g:"Nunito:wght@400;600;800"},
  Space:     {css:"'Space Grotesk',sans-serif",         g:"Space+Grotesk:wght@400;600;700"},
  Oswald:    {css:"'Oswald',sans-serif",                g:"Oswald:wght@400;500;600"},
  Bitter:    {css:"'Bitter',serif",                     g:"Bitter:wght@400;600;700"},
  Playfair:  {css:"'Playfair Display',serif",           g:"Playfair+Display:wght@500;600;700"},
  Cormorant: {css:"'Cormorant Garamond',serif",         g:"Cormorant+Garamond:wght@500;600;700"},
  Caveat:    {css:"'Caveat',cursive",                   g:"Caveat:wght@600;700"}
};
const FORMATOS = {clasico:"Clásico", lujo:"Alta gama", noche:"Nocturno", delivery:"App delivery", cristal:"Cristal"};
const EFECTOS  = {sombra:"Sombra", neumorfismo:"Neumorfismo", vidrio:"Vidrio", borde:"Borde fino"};
const LAYOUTS  = {grilla:"▦ Grilla", lista:"☰ Lista", grande:"▭ Grande"};
const BADGE_DEST = {clasico:"⭐ Recomendado", lujo:"Del chef", noche:"★ Top", delivery:"🔥 Más pedido", cristal:"✨ Favorito"};
const LABEL_DEST = {clasico:"⭐ Recomendado", lujo:"Sugerencia del chef", noche:"★ Top", delivery:"🔥 Más pedido", cristal:"✨ Favorito"};

/* Plantillas = códigos de formato listos para usar */
const CODIGOS = {
  clasico: {nombre:"Clásico parrilla", formato:"clasico", pri:"#b5541c", bg:"#f4ede1", card:"#fffaf2", txt:"#3b2a1a", fb:"Nunito",     ft:"Bitter",    r:16, efecto:"sombra",      layout:"grilla"},
  lujo:    {nombre:"Alta gama",        formato:"lujo",    pri:"#9a7b4f", bg:"#f7f4ee", card:"#fffdf8", txt:"#1c1a17", fb:"Montserrat", ft:"Cormorant", r:2,  efecto:"borde",       layout:"grande"},
  noche:   {nombre:"Nocturno",         formato:"noche",   pri:"#ff2d55", bg:"#0a0a0f", card:"#15151d", txt:"#f5f5f7", fb:"Inter",      ft:"Oswald",    r:14, efecto:"sombra",      layout:"grilla"},
  delivery:{nombre:"App delivery",     formato:"delivery",pri:"#ff4d00", bg:"#f2f3f5", card:"#ffffff", txt:"#111827", fb:"Poppins",    ft:"Poppins",   r:18, efecto:"sombra",      layout:"lista"},
  cristal: {nombre:"Cristal",          formato:"cristal", pri:"#7c3aed", bg:"#f5f3ff", card:"#ffffff", txt:"#1e1b4b", fb:"Space",      ft:"Space",     r:22, efecto:"vidrio",      layout:"grilla"},
  oro:     {nombre:"Oro negro",        formato:"lujo",    pri:"#d4af37", bg:"#0e0d0b", card:"#17150f", txt:"#f3ead8", fb:"Montserrat", ft:"Playfair",  r:0,  efecto:"borde",       layout:"lista"},
  neon:    {nombre:"Neón",             formato:"noche",   pri:"#00e5ff", bg:"#05060a", card:"#0d1018", txt:"#e8fbff", fb:"Space",      ft:"Space",     r:20, efecto:"vidrio",      layout:"grilla"},
  pizarra: {nombre:"Pizarrón",         formato:"clasico", pri:"#f2c14e", bg:"#263029", card:"#2f3a33", txt:"#f1f1e8", fb:"Nunito",     ft:"Caveat",    r:12, efecto:"borde",       layout:"lista"},
  fresh:   {nombre:"Fresh",            formato:"delivery",pri:"#16a34a", bg:"#ecfdf3", card:"#ffffff", txt:"#052e16", fb:"Inter",      ft:"Inter",     r:22, efecto:"sombra",      layout:"grilla"},
  suave:   {nombre:"Suave",            formato:"clasico", pri:"#e76f51", bg:"#e8ecf1", card:"#e8ecf1", txt:"#2b2d42", fb:"Nunito",     ft:"Poppins",   r:24, efecto:"neumorfismo", layout:"grilla"}
};
const ESTILO_KEYS = ["formato","pri","bg","card","txt","fb","ft","r","efecto","layout"];
const fromCodigo = k => Object.fromEntries(ESTILO_KEYS.map(x=>[x,CODIGOS[k][x]]));

/* =========================================================
   DATOS INICIALES
   ========================================================= */
let uid = 100;
const P = (cat,nombre,desc,precio,emoji,extra={}) => ({id:"p"+(uid++),cat,nombre,desc,precio,precioAntes:0,emoji,foto:null,stock:true,destacado:false,...extra});
const DEF = {
  local:{nombre:"La Brasa Burger", slogan:"Hamburguesas a la parrilla, como en casa", emoji:"🍔", logo:null,
         horario:"Mar a Dom · 19 a 00 h", direccion:"Av. Pellegrini 1234", whatsapp:"341 555-1234",
         url:"https://carta.irodev.com.ar", qrTam:"grande"},   // link al que apunta el QR + tamaño de tarjeta elegido
  estilo:{tema:"clasico", codigo:"CLASICO", ...fromCodigo("clasico"), fotos:true, desc:true, anim:true},
  promo:{activa:true, emoji:"🔥", titulo:"Martes 2x1 en Clásicas", texto:"Todos los martes, llevás 2 hamburguesas clásicas al precio de 1."},
  categorias:[
    {id:"c1",nombre:"Hamburguesas",emoji:"🍔"},{id:"c2",nombre:"Combos",emoji:"🍟"},
    {id:"c3",nombre:"Para acompañar",emoji:"🧀"},{id:"c4",nombre:"Bebidas",emoji:"🥤"},{id:"c5",nombre:"Postres",emoji:"🍦"}
  ],
  productos:[
    P("c1","Clásica","Medallón de 150 g, lechuga, tomate, cebolla y salsa de la casa.",11500,"🍔"),
    P("c1","Doble Cheddar","Doble medallón, doble cheddar y pepinos.",14900,"🍔",{destacado:true}),
    P("c1","Bacon BBQ","Medallón, panceta crocante, cheddar, cebolla caramelizada y barbacoa.",15900,"🥓",{destacado:true}),
    P("c1","Criolla","Medallón, provoleta, morrón asado y chimichurri.",15500,"🌶️"),
    P("c1","Veggie","Medallón de garbanzos y quinoa, palta, rúcula y tomate.",13900,"🥬"),
    P("c2","Combo Clásico","Hamburguesa Clásica + papas medianas + gaseosa.",16900,"🍟"),
    P("c2","Combo Doble","Doble Cheddar + papas grandes + gaseosa.",20500,"🍟",{destacado:true,precioAntes:23900}),
    P("c3","Papas fritas","Porción mediana con sal y romero.",6500,"🍟"),
    P("c3","Papas cheddar y panceta","Porción grande bañada en cheddar.",9500,"🧀",{precioAntes:11000}),
    P("c3","Aros de cebolla","8 unidades con dip de alioli.",7200,"🧅",{stock:false}),
    P("c4","Gaseosa 500 ml","Línea Coca-Cola.",3500,"🥤"),
    P("c4","Cerveza artesanal","Pinta de IPA o Rubia.",5800,"🍺"),
    P("c4","Agua sin gas","500 ml.",2800,"💧"),
    P("c5","Brownie con helado","Brownie tibio con bocha de crema americana.",7500,"🍫"),
    P("c5","Flan casero","Con dulce de leche o crema.",5900,"🍮")
  ]
};
const clone = o => JSON.parse(JSON.stringify(o));
const DOMINIO = "irodev.com.ar";   // los QR impresos siempre tienen que apuntar a este dominio

/* =========================================================
   ESTADO (localStorage) + migración desde la versión anterior
   ========================================================= */
const KEY = "cartaDemo_v2", OLD_KEY = "cartaDemo_v1";
function migrate(s){
  const d = clone(DEF), e = s.estilo || {};
  const teniaUrl = !!s.local && "url" in s.local;
  s.local = {...d.local, ...s.local};
  if (!teniaUrl) s.local.url = "";   // un estado viejo no hereda el link de la demo como "listo para imprimir"
  s.promo = {...d.promo, ...s.promo};
  const viejo = {rustico:"clasico", oscuro:"noche", colorido:"delivery", minimal:"lujo"};
  s.estilo = {...d.estilo, ...e};
  if (!e.formato) s.estilo.formato = viejo[e.tema] || "clasico";
  if (e.font && !e.fb) { s.estilo.fb = s.estilo.ft = FUENTES[e.font] ? e.font : "Nunito"; }
  delete s.estilo.font;
  if (!FUENTES[s.estilo.fb]) s.estilo.fb = "Nunito";
  if (!FUENTES[s.estilo.ft]) s.estilo.ft = s.estilo.fb;
  s.categorias = s.categorias || d.categorias;
  s.productos = (s.productos || d.productos).map(p => ({precioAntes:0, ...p}));
  return s;
}
let S;
try {
  const raw = localStorage.getItem(KEY) || localStorage.getItem(OLD_KEY);
  S = raw ? migrate(JSON.parse(raw)) : clone(DEF);
} catch(e) { S = clone(DEF); }
let saveT;
function save(){
  clearTimeout(saveT);
  saveT = setTimeout(()=>{ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast("⚠️ No se pudo guardar (¿foto muy pesada?)"); } }, 300);
}

/* =========================================================
   UTILIDADES
   ========================================================= */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const NF = new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:0});
const fmt = n => NF.format(n||0);
const off = p => (p.precioAntes > p.precio && p.precio > 0) ? Math.round((1 - p.precio/p.precioAntes)*100) : 0;
const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const animOn = () => S.estilo.anim && !matchMedia("(prefers-reduced-motion: reduce)").matches;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1900)}
function setPath(path,val){const k=path.split(".");let o=S;for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k.at(-1)]=val}
function getPath(path){return path.split(".").reduce((o,k)=>o?.[k],S)}
function onColor(hex){
  const h=hex.replace("#",""); const [r,g,b]=[0,2,4].map(i=>parseInt(h.substr(i,2),16)/255).map(c=>c<=.03928?c/12.92:((c+.055)/1.055)**2.4);
  return (.2126*r+.7152*g+.0722*b) > .45 ? "#111111" : "#ffffff";
}
function resizeImg(file,max=640){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{const im=new Image();im.onload=()=>{
      const sc=Math.min(1,max/Math.max(im.width,im.height));
      const c=document.createElement("canvas");c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.8));
    };im.onerror=rej;im.src=fr.result};
    fr.onerror=rej;fr.readAsDataURL(file);
  });
}

/* =========================================================
   CÓDIGO DE FORMATO
   Sintaxis:  BASE  clave=valor  clave=valor ...
   Ej:  NOCHE        |   NEON radio=24 vista=lista
        formato=lujo; color=#c9a227; letra=Inter; titulos=Playfair
   ========================================================= */
const CLAVES = {
  formato:"formato", estilo:"formato", personalidad:"formato",
  color:"pri", principal:"pri", fondo:"bg", superficie:"card", tarjetas:"card", texto:"txt",
  letra:"fb", fuente:"fb", titulos:"ft",
  radio:"r", bordes:"r", vista:"layout", distribucion:"layout", layout:"layout",
  efecto:"efecto", tarjeta:"efecto", anim:"anim", animaciones:"anim", fotos:"fotos", desc:"desc", descripciones:"desc"
};
function validar(campo, v){
  const vn = norm(v).replace(/"/g,"");
  const si = ["si","on","true","1"], no = ["no","off","false","0"];
  switch(campo){
    case "pri": case "bg": case "card": case "txt": {
      let m = vn.match(/^#?([0-9a-f]{3}|[0-9a-f]{6})$/); if(!m) return null;
      let h = m[1]; if(h.length===3) h=[...h].map(c=>c+c).join(""); return "#"+h;
    }
    case "fb": case "ft": return Object.keys(FUENTES).find(k=>norm(k)===vn.split(/\s+/)[0]) || null;
    case "r": { const n=parseInt(vn,10); return isNaN(n)?null:Math.max(0,Math.min(32,n)); }
    case "formato": return FORMATOS[vn] ? vn : (vn==="glass"?"cristal":null);
    case "layout": return LAYOUTS[vn] ? vn : null;
    case "efecto": return EFECTOS[vn] ? vn : (vn==="neumorfico"?"neumorfismo":null);
    case "anim": case "fotos": case "desc": return si.includes(vn) ? true : no.includes(vn) ? false : null;
  }
  return null;
}
function parseCodigo(str){
  const patch = {}, ok = [], bad = []; let base = null;
  const pares = [];
  const resto = String(str).replace(/([a-záéíóúñ]+)\s*[:=]\s*("[^"]*"|[^;\s,]+)/gi, (_,k,v)=>{ pares.push([k,v]); return " "; });
  resto.split(/[\s;,]+/).filter(Boolean).forEach(w=>{
    const k = norm(w);
    if (CODIGOS[k]) { Object.assign(patch, fromCodigo(k)); base = k; ok.push(w.toUpperCase()); }
    else bad.push(`"${w}" no es un código`);
  });
  pares.forEach(([k,v])=>{
    const campo = CLAVES[norm(k)];
    if (!campo) { bad.push(`clave "${k}" desconocida`); return; }
    const val = validar(campo, v);
    if (val === null) { bad.push(`${k}: "${v}" no válido`); return; }
    patch[campo] = val; ok.push(`${k}=${v.replace(/"/g,"")}`);
  });
  return {patch, ok, bad, base: (base && pares.length===0 && bad.length===0) ? base : null};
}
function genCodigo(){
  const e=S.estilo, b=x=>x?"si":"no";
  return `formato=${e.formato} color=${e.pri} fondo=${e.bg} superficie=${e.card} texto=${e.txt} letra=${e.fb} titulos=${e.ft} radio=${e.r} vista=${e.layout} efecto=${e.efecto} anim=${b(e.anim)} fotos=${b(e.fotos)} desc=${b(e.desc)}`;
}
let codeT, lastFb = "";
function aplicarCodigo(str, {silent=false}={}){
  S.estilo.codigo = str;
  const {patch, ok, bad, base} = parseCodigo(str);
  lastFb = ok.map(x=>`<span class="ok">✓ ${esc(x)}</span>`).join("") + bad.map(x=>`<span class="bad">✕ ${esc(x)}</span>`).join("");
  const fb=$("#codeFb"); if(fb) fb.innerHTML = lastFb;
  if (Object.keys(patch).length){
    Object.assign(S.estilo, patch);
    S.estilo.tema = base;
    renderMenu({instant:true});
    const rest=$("#dRest"); if(rest) rest.innerHTML = disenoRestHTML();
  }
  save();
  if(!silent && ok.length && !bad.length) toast("✨ Formato aplicado");
}

function setupSpy(){
  spyIO?.disconnect();
  spyIO=new IntersectionObserver(es=>es.forEach(en=>{
    if(!en.isIntersecting) return;
    const chips=$("#chips"), chip=chips?.querySelector(`[data-go="${en.target.id}"]`); if(!chip) return;
    chips.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c===chip));
    chips.scrollTo({left:chip.offsetLeft-chips.clientWidth/2+chip.offsetWidth/2,behavior:animOn()?"smooth":"auto"});
  }),{rootMargin:"-38% 0px -58% 0px"});
  $$("section.cat").forEach(s=>spyIO.observe(s));
}
function applySearch(){
  const t=norm(q.trim()); let any=false;
  $$("section.cat").forEach(s=>{
    let vis=0;
    s.querySelectorAll(".item").forEach(it=>{const show=!t||it.dataset.q.includes(t);it.hidden=!show;if(show)vis++});
    s.hidden = vis===0 || (t && s.id==="sec-dest"); if(!s.hidden) any=true;
  });
  $("#empty").style.display=any?"none":"block";
}

const ov=$("#detOv"), det=$("#det"); let fromEl=null;
function openDet(el){
  const p=S.productos.find(x=>x.id===el.dataset.id); if(!p) return;
  fromEl=el;
  det.innerHTML=`<span class="handle"></span>
    <div class="foto">${media(p)}${badgesHTML(p)}</div>
    <div class="body"><h2>${esc(p.nombre)}</h2>${p.desc?`<p class="d">${esc(p.desc)}</p>`:""}
      <div class="pr"><span class="precio">${fmt(p.precio)}</span>${off(p)?`<s class="antes">${fmt(p.precioAntes)}</s>`:""}</div>
      ${off(p)?`<span class="ahorro">Ahorrás ${fmt(p.precioAntes-p.precio)}</span>`:""}
      ${!p.stock?`<p class="nostock">Momentáneamente sin stock</p>`:""}
      <button class="cerrar">Cerrar</button></div>`;
  det.scrollTop=0; ov.classList.add("open"); document.body.style.overflow="hidden";
  requestAnimationFrame(()=>ov.classList.add("show"));
  if(animOn()){
    const a=el.getBoundingClientRect(), b=det.getBoundingClientRect(), s=a.width/b.width;
    const dx=(a.left+a.width/2)-(b.left+b.width/2), dy=(a.top+a.height/2)-(b.top+b.height/2);
    det.animate([{transform:`translate(${dx}px,${dy}px) scale(${s})`,opacity:.35,borderRadius:"16px"},{transform:"none",opacity:1}],
      {duration:430,easing:"cubic-bezier(.2,.9,.25,1)"});
  }
}
function closeDet(){
  if(!ov.classList.contains("open")) return;
  ov.classList.remove("show");
  const done=()=>{ov.classList.remove("open");det.style.transform="";document.body.style.overflow="";fromEl?.focus({preventScroll:true})};
  if(animOn()) det.animate([{transform:det.style.transform||"none",opacity:1},{transform:"translateY(60%)",opacity:0}],{duration:230,easing:"ease-in"}).finished.then(done);
  else done();
}
ov.addEventListener("click",e=>{if(e.target===ov||e.target.classList.contains("cerrar"))closeDet()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDet()});
// Deslizar hacia abajo para cerrar
let ty=null;
det.addEventListener("touchstart",e=>{ty=det.scrollTop<=0?e.touches[0].clientY:null},{passive:true});
det.addEventListener("touchmove",e=>{if(ty===null)return;const d=e.touches[0].clientY-ty;if(d>0)det.style.transform=`translateY(${d}px)`},{passive:true});
det.addEventListener("touchend",e=>{if(ty===null)return;const d=e.changedTouches[0].clientY-ty;ty=null;
  if(d>110)closeDet();else{det.style.transform="";if(animOn())det.animate([{transform:`translateY(${d}px)`},{transform:"none"}],{duration:200,easing:"ease-out"})}});

/* =========================================================
   GENERADOR DE QR (solo panel del dueño)
   - La librería se carga recién al abrir la pestaña QR.
   - Un único "modelo" (lista de figuras en mm) alimenta el PNG, el SVG y la impresión.
   ========================================================= */
const QR_LIB = "https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js";
const QR_DPI = 300;
const PT = 25.4/72;   // 1 punto tipográfico en mm
/* Medidas de cada tarjeta en mm (QR = cuadrado con la zona de silencio incluida) */
const QR_TAMS = {
  grande:{w:100,h:140,cols:2,rows:2,franja:6,logoY:19,logoR:9,nomY:31,nomH:18,nomAncho:84,nomMax:24,nomMin:16,
          llamY:56.5,llamPt:13,qrX:20,qrY:61,qrS:60,esqT:1.5,esqL:8,esqGap:1.5,
          ayudaY:128.5,ayudaPt:9,linkY:134,linkPt:8,bandaY:131,bandaPt:11},
  chico: {w:65,h:90,cols:3,rows:3,franja:4,logoY:11,logoR:6,nomY:18.5,nomH:9.3,nomAncho:55,nomMax:14,nomMin:11,
          llamY:31.6,llamPt:8,qrX:8.5,qrY:34.5,qrS:48,esqT:1,esqL:5.5,esqGap:1,
          ayudaY:null,ayudaPt:0,linkY:87.8,linkPt:6.5,bandaY:85.2,bandaPt:7}
};

/* Valida el link del QR. ok = se puede generar; provisorio = se genera pero no hay que imprimirlo */
function validarUrl(str){
  let s=String(str??"").trim(), agregado=false;
  const base={ok:false,provisorio:false,url:"",corto:"",agregado:false};
  if(!s) return {...base,msg:"Escribí el link de tu carta para generar el QR."};
  const MAL=`Ese link no es válido. Tiene que ser algo como https://carta.${DOMINIO}`;
  // ¿Tiene esquema (https:, javascript:, ...)? "algo.com:8080" no cuenta como esquema
  const tieneEsquema=/^[a-z][a-z0-9+.-]*:/i.test(s) && !/^[^:\/]+:\d/.test(s);
  if(!tieneEsquema){ s="https://"+s.replace(/^\/+/,""); agregado=true; }
  let u; try{ u=new URL(s); }catch(e){ return {...base,msg:MAL}; }
  if(!["http:","https:"].includes(u.protocol) || !u.hostname.includes(".") || u.username || u.password) return {...base,msg:MAL};
  const h=u.hostname, avisos=[];
  if(u.protocol==="http:") avisos.push("El link empieza con http://. Usá https:// para que el celular no muestre advertencias.");
  if(h.endsWith(".pages.dev")) avisos.push("Es un link de vista previa (.pages.dev) y puede cambiar o dejar de andar.");
  else if(!(h===DOMINIO || h.endsWith("."+DOMINIO))) avisos.push(`El link no es de ${DOMINIO}. Los QR impresos tienen que apuntar a tu dominio.`);
  if(u.port) avisos.push(`El link tiene un puerto (:${u.port}). Los QR impresos tienen que usar el link sin puerto.`);
  return {ok:true,provisorio:avisos.length>0,url:u.href,corto:linkLegible(u,s),agregado,msg:avisos.length?avisos.join(" "):"Link listo para imprimir"};
}
/* Link para mostrar en la tarjeta (sin https://), legible: ruta con acentos en vez de %C3%BA y,
   si el dominio tiene ñ/acentos (IDN), tal como lo escribió el dueño en vez de "xn--…".
   Solo se muestra: el QR usa siempre u.href. Se escapa con esc() donde se mete en SVG/HTML. */
function linkLegible(u,tipeado){
  const raro=/[\u0000-\u001f\u007f-\u009f‎‏‪-‮⁦-⁩]/;   // controles y marcas de dirección
  let host=u.hostname;
  if(host.split(".").some(p=>p.startsWith("xn--"))){
    const m=/^[a-z][a-z0-9+.-]*:\/\/([^\/?#\\]*)/i.exec(tipeado), t=m?m[1].replace(/:\d*$/,"").toLowerCase():"";
    try{ if(t&&!raro.test(t)&&new URL("https://"+t).hostname===host) host=t; }catch(e){}   // si no coincide, queda punycode
  }
  const crudo=(u.pathname==="/"?"":u.pathname)+u.search+u.hash;
  let resto=crudo;
  try{ resto=decodeURI(crudo); if(raro.test(resto)) resto=crudo; }catch(e){ resto=crudo; }
  return host+(u.port?":"+u.port:"")+resto;
}

/* Carga de la librería: una sola promesa; si falla se descarta para poder reintentar */
let qrLibP=null;
function cargarQrLib(){
  if(window.qrcode) return Promise.resolve();
  if(qrLibP) return qrLibP;
  qrLibP=new Promise((res,rej)=>{
    const sc=document.createElement("script"); sc.src=QR_LIB; sc.async=true; sc.referrerPolicy="no-referrer";
    const fallo=()=>{ clearTimeout(to); sc.remove(); rej(new Error("No cargó qrcode")); };
    const to=setTimeout(fallo,15000);
    sc.onload=()=>{ clearTimeout(to); window.qrcode?res():fallo(); };
    sc.onerror=fallo;
    document.head.appendChild(sc);
  }).catch(err=>{ qrLibP=null; throw err; });
  return qrLibP;
}

/* Medición de texto (en mm) con un canvas auxiliar */
let qrMed=null;
function medir(s,peso,mm,font){
  qrMed=qrMed||document.createElement("canvas").getContext("2d");
  qrMed.font=`${peso} ${mm*10}px ${font}`;
  return qrMed.measureText(s).width/10;
}
/* Parte el texto en líneas y achica la letra hasta que entre; si ni al mínimo entra, corta con "…" */
function ajustarTexto(s,{font,peso,maxPt,minPt,ancho,lineas=1,alto=0}){
  const palabras=String(s??"").trim().split(/\s+/).filter(Boolean);
  if(!palabras.length) return {mm:maxPt*PT,lines:[]};
  const partir=mm=>{ const out=[]; let cur="";
    for(const w of palabras){ const t=cur?cur+" "+w:w; if(!cur||medir(t,peso,mm,font)<=ancho) cur=t; else { out.push(cur); cur=w; } }
    if(cur) out.push(cur); return out; };
  for(let pt=maxPt; pt>=minPt-0.001; pt-=0.5){
    const mm=pt*PT, ls=partir(mm);
    if(ls.length<=lineas && ls.every(l=>medir(l,peso,mm,font)<=ancho) && (!alto||ls.length*mm*1.12<=alto)) return {mm,lines:ls};
  }
  const mm=minPt*PT, todas=partir(mm), ls=todas.slice(0,lineas);
  const recortar=(l,forzar)=>{ let ch=[...l]; if(!forzar&&medir(l,peso,mm,font)<=ancho) return l;
    while(ch.length>1&&medir(ch.join("")+"…",peso,mm,font)>ancho) ch.pop(); return ch.join("").trimEnd()+"…"; };
  return {mm,lines:ls.map((l,i)=>recortar(l, i===ls.length-1 && todas.length>ls.length))};
}
/* Color principal mezclado con blanco (para el círculo del emoji) */
function mezclaBlanco(hex,a){
  const m=/^#?([0-9a-f]{6})$/i.exec(String(hex||"")); if(!m) return "#eeeeee";
  const n=parseInt(m[1],16), c=[n>>16,(n>>8)&255,n&255].map(v=>Math.round(255+(v-255)*a));
  return "#"+c.map(v=>v.toString(16).padStart(2,"0")).join("");
}
const colorOk = c => /^#[0-9a-f]{3,8}$/i.test(String(c)) ? c : "#111111";
const LOGO_OK = /^data:image\/(png|jpe?g|webp|gif);base64,[A-Za-z0-9+/=]+$/;   // solo logos subidos (data URL); si no, va el emoji
const cargarImg = src => new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=src; });

/* Arma el modelo de la tarjeta: tamaño en mm + lista de figuras */
function qrModelo(v,tam,matriz,logo){
  const T=QR_TAMS[tam], L=S.local, e=S.estilo, pri=colorOk(e.pri), cx=T.w/2;
  const fT=(FUENTES[e.ft]||FUENTES.Sistema).css, fB=(FUENTES[e.fb]||FUENTES.Sistema).css;
  const fEmoji=`"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
  const ops=[{t:"rect",x:0,y:0,w:T.w,h:T.h,fill:"#fff"}];   // fondo siempre blanco
  ops.push({t:"rect",x:0,y:0,w:T.w,h:T.franja,fill:pri});    // franja decorativa
  // Logo (recorte circular) o emoji en círculo
  if(logo) ops.push({t:"logo",cx,cy:T.logoY,r:T.logoR,src:L.logo});
  else {
    ops.push({t:"circle",cx,cy:T.logoY,r:T.logoR,fill:mezclaBlanco(pri,.12)});
    const em=T.logoR*1.1; ops.push({t:"text",s:L.emoji||"🍽️",x:cx,y:T.logoY+em*.36,mm:em,font:fEmoji,peso:400,fill:"#111"});
  }
  // Nombre: hasta 2 líneas, centrado en su caja
  const nom=ajustarTexto(L.nombre,{font:fT,peso:700,maxPt:T.nomMax,minPt:T.nomMin,ancho:T.nomAncho,lineas:2,alto:T.nomH});
  const lh=nom.mm*1.12, top=T.nomY+(T.nomH-lh*nom.lines.length)/2;
  nom.lines.forEach((s,i)=>ops.push({t:"text",s,x:cx,y:top+lh*i+lh/2+nom.mm*.35,mm:nom.mm,font:fT,peso:700,fill:"#111"}));
  // Llamado
  const ll=ajustarTexto("Escaneá para ver la carta",{font:fB,peso:700,maxPt:T.llamPt,minPt:T.llamPt-3,ancho:T.nomAncho});
  ops.push({t:"text",s:ll.lines[0],x:cx,y:T.llamY,mm:ll.mm,font:fB,peso:700,fill:"#111"});
  // QR con zona de silencio de 4 módulos
  const n=matriz.length, cel=T.qrS/(n+8);
  ops.push({t:"modulos",x:T.qrX+4*cel,y:T.qrY+4*cel,cel,m:matriz,fill:"#111"});
  // Esquinas en L, por fuera de la zona de silencio
  const o=T.esqGap+T.esqT/2, x1=T.qrX-o, y1=T.qrY-o, x2=T.qrX+T.qrS+o, y2=T.qrY+T.qrS+o, Lg=T.esqL;
  [[x1,y1,1,1],[x2,y1,-1,1],[x1,y2,1,-1],[x2,y2,-1,-1]].forEach(([x,y,dx,dy])=>
    ops.push({t:"trazo",pts:[[x,y+dy*Lg],[x,y],[x+dx*Lg,y]],stroke:pri,ancho:T.esqT}));
  // Textos de abajo (y banda roja si es provisorio)
  const chico=t=>ajustarTexto(t.s,{font:fB,peso:t.peso||400,maxPt:t.pt,minPt:t.pt-2,ancho:T.nomAncho});
  if(v.provisorio){
    if(tam==="grande"){ const k=chico({s:v.corto,pt:T.linkPt}); ops.push({t:"text",s:k.lines[0],x:cx,y:T.ayudaY,mm:k.mm,font:fB,peso:400,fill:"#555"}); }
    ops.push({t:"rect",x:0,y:T.bandaY,w:T.w,h:T.h-T.bandaY,fill:"#c00"});
    const b=T.bandaPt*PT; ops.push({t:"text",s:"QR PROVISORIO",x:cx,y:T.bandaY+(T.h-T.bandaY)/2+b*.36,mm:b,font:fB,peso:700,fill:"#fff"});
  } else {
    if(T.ayudaY){ const a=chico({s:"Apuntá la cámara del celu al código",pt:T.ayudaPt}); ops.push({t:"text",s:a.lines[0],x:cx,y:T.ayudaY,mm:a.mm,font:fB,peso:400,fill:"#555"}); }
    const k=chico({s:v.corto,pt:T.linkPt}); ops.push({t:"text",s:k.lines[0],x:cx,y:T.linkY,mm:k.mm,font:fB,peso:400,fill:"#555"});
  }
  return {w:T.w,h:T.h,ops};
}

/* Modelo -> canvas a 300 dpi (se dibuja en píxeles para que el QR quede nítido) */
function qrCanvas(m,logoImg){
  const k=QR_DPI/25.4, P=v=>v*k, c=document.createElement("canvas");
  c.width=Math.round(m.w*k); c.height=Math.round(m.h*k);
  const x=c.getContext("2d");
  for(const o of m.ops){
    x.save();
    if(o.t==="rect"){ x.fillStyle=o.fill; x.fillRect(P(o.x),P(o.y),P(o.w),P(o.h)); }
    else if(o.t==="circle"){ x.fillStyle=o.fill; x.beginPath(); x.arc(P(o.cx),P(o.cy),P(o.r),0,Math.PI*2); x.fill(); }
    else if(o.t==="logo"&&logoImg){
      x.beginPath(); x.arc(P(o.cx),P(o.cy),P(o.r),0,Math.PI*2); x.clip();
      const d=2*o.r, s=Math.max(d/logoImg.width,d/logoImg.height), w=logoImg.width*s, h=logoImg.height*s;   // "cover"
      x.drawImage(logoImg,P(o.cx-w/2),P(o.cy-h/2),P(w),P(h));
    }
    else if(o.t==="text"){ x.fillStyle=o.fill; x.font=`${o.peso} ${P(o.mm)}px ${o.font}`; x.textAlign="center"; x.textBaseline="alphabetic"; x.fillText(o.s,P(o.x),P(o.y)); }
    else if(o.t==="modulos"){
      x.fillStyle=o.fill; const px=v=>Math.round(P(v));   // bordes en píxeles enteros: sin líneas finas entre módulos
      o.m.forEach((fila,r)=>fila.forEach((on,col)=>{ if(!on) return;
        const x0=px(o.x+col*o.cel), x1=px(o.x+(col+1)*o.cel), y0=px(o.y+r*o.cel), y1=px(o.y+(r+1)*o.cel);
        x.fillRect(x0,y0,x1-x0,y1-y0); }));
    }
    else if(o.t==="trazo"){
      x.strokeStyle=o.stroke; x.lineWidth=P(o.ancho); x.lineJoin="miter"; x.lineCap="butt"; x.beginPath();
      o.pts.forEach(([a,b],i)=>i?x.lineTo(P(a),P(b)):x.moveTo(P(a),P(b))); x.stroke();
    }
    x.restore();
  }
  return c;
}

/* Modelo -> SVG en mm (texto escapado con esc) */
function qrSvg(m){
  const f=n=>+n.toFixed(3);
  let defs="", body="";
  for(const o of m.ops){
    if(o.t==="rect") body+=`<rect x="${f(o.x)}" y="${f(o.y)}" width="${f(o.w)}" height="${f(o.h)}" fill="${esc(o.fill)}"/>`;
    else if(o.t==="circle") body+=`<circle cx="${f(o.cx)}" cy="${f(o.cy)}" r="${f(o.r)}" fill="${esc(o.fill)}"/>`;
    else if(o.t==="logo"){
      defs+=`<clipPath id="qrLogoClip"><circle cx="${f(o.cx)}" cy="${f(o.cy)}" r="${f(o.r)}"/></clipPath>`;
      body+=`<image href="${esc(o.src)}" xlink:href="${esc(o.src)}" x="${f(o.cx-o.r)}" y="${f(o.cy-o.r)}" width="${f(2*o.r)}" height="${f(2*o.r)}" preserveAspectRatio="xMidYMid slice" clip-path="url(#qrLogoClip)"/>`;
    }
    else if(o.t==="text") body+=`<text x="${f(o.x)}" y="${f(o.y)}" font-family="${esc(o.font)}" font-weight="${o.peso}" font-size="${f(o.mm)}" fill="${esc(o.fill)}" text-anchor="middle">${esc(o.s)}</text>`;
    else if(o.t==="modulos"){
      let d="";   // un único path: tramos horizontales de módulos oscuros
      o.m.forEach((fila,r)=>{ for(let c=0;c<fila.length;c++){ if(!fila[c]) continue; let e=c; while(e+1<fila.length&&fila[e+1]) e++;
        d+=`M${f(o.x+c*o.cel)} ${f(o.y+r*o.cel)}h${f((e-c+1)*o.cel)}v${f(o.cel)}h${f(-(e-c+1)*o.cel)}z`; c=e; } });
      body+=`<path d="${d}" fill="${esc(o.fill)}" shape-rendering="crispEdges"/>`;
    }
    else if(o.t==="trazo") body+=`<path d="${o.pts.map(([a,b],i)=>(i?"L":"M")+f(a)+" "+f(b)).join("")}" fill="none" stroke="${esc(o.stroke)}" stroke-width="${f(o.ancho)}" stroke-linejoin="miter" stroke-linecap="butt"/>`;
  }
  return `<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${m.w}mm" height="${m.h}mm" viewBox="0 0 ${m.w} ${m.h}">`+
    (defs?`<defs>${defs}</defs>`:"")+body+`</svg>`;
}

/* Genera PNG (canvas) + SVG a partir del link validado */
async function qrGenerar(v,tam){
  const e=S.estilo, fams=[...new Set([(FUENTES[e.ft]||FUENTES.Sistema).css,(FUENTES[e.fb]||FUENTES.Sistema).css])];
  try{   // esperamos las fuentes (máx. 1,5 s) para que el canvas no use la de respaldo
    await Promise.race([Promise.all(fams.map(c=>document.fonts.load(`700 40px ${c}`))),new Promise(r=>setTimeout(r,1500))]);
  }catch(err){}
  const q=qrcode(0,"M"); q.addData(v.url); q.make();
  const n=q.getModuleCount(), matriz=[];
  for(let r=0;r<n;r++){ const fila=[]; for(let c=0;c<n;c++) fila.push(q.isDark(r,c)); matriz.push(fila); }
  let logoImg=null;
  if(LOGO_OK.test(S.local.logo||"")){ try{ logoImg=await cargarImg(S.local.logo); }catch(err){ logoImg=null; } }
  const m=qrModelo(v,tam,matriz,!!logoImg);
  return {canvas:qrCanvas(m,logoImg), svg:qrSvg(m), url:v.url, corto:v.corto, tam};
}

/* Estado de la pestaña QR */
let qrTok=0, qrUltimo=null, qrT;
function qrProgramar(){ clearTimeout(qrT); qrT=setTimeout(qrActualizar,300); }
function qrPintarEstado(v){
  const el=$("#qrEstado"); if(!el) return;
  let h;
  if(!v.ok) h=!String(S.local.url||"").trim() ?`<div class="hint" style="margin:6px 0 10px">${esc(v.msg)}</div>` : `<div class="fb"><span class="bad">✕ ${esc(v.msg)}</span></div>`;
  else if(v.provisorio) h=`<div class="aviso"><b>QR provisorio: no lo imprimas</b>${esc(v.msg)}</div>`;
  else h=`<div class="fb"><span class="ok">✓ ${esc(v.msg)}</span></div>`;
  if(v.ok&&v.agregado) h+=`<div class="hint" style="margin:-4px 0 10px">Le agregamos https:// adelante.</div>`;
  el.innerHTML=h;
}
function qrBotones(v){
  const listo=!!(v.ok&&qrUltimo&&window.qrcode);
  $$('#panel [data-qr="png"],#panel [data-qr="svg"],#panel [data-qr="print"]').forEach(b=>b.setAttribute("aria-disabled",String(!listo)));
  $$('#panel [data-qr="abrir"]').forEach(b=>b.setAttribute("aria-disabled",String(!v.ok)));
}
async function qrActualizar(){
  clearTimeout(qrT);
  const prev=$("#qrPrev"); if(tab!=="qr"||!prev) return;
  const tok=++qrTok, v=validarUrl(S.local.url), tam=S.local.qrTam==="chico"?"chico":"grande";
  qrUltimo=null; qrPintarEstado(v); qrBotones(v);
  const lib=cargarQrLib();   // se pide al abrir la pestaña, aunque el link todavía no sea válido
  lib.catch(()=>{});
  if(!v.ok){ prev.innerHTML=`<div class="qrvacio">${esc(v.msg)}</div>`; return; }
  if(!window.qrcode){
    prev.innerHTML=`<div class="qrvacio">Cargando el generador de QR…</div>`;
    try{ await lib; }catch(err){
      if(tok===qrTok&&$("#qrPrev")) $("#qrPrev").innerHTML=`<div class="qrvacio">No se pudo cargar el generador de QR. Revisá la conexión a internet y tocá Reintentar.<br><button class="btn sec mini" data-qr="retry">Reintentar</button></div>`;
      return;
    }
  }
  if(tok!==qrTok) return;
  try{
    const r=await qrGenerar(v,tam);
    if(tok!==qrTok||!$("#qrPrev")) return;   // llegó tarde: el dueño siguió escribiendo
    qrUltimo=r; $("#qrPrev").replaceChildren(r.canvas); qrBotones(v);
  }catch(err){
    if(tok===qrTok&&$("#qrPrev")) $("#qrPrev").innerHTML=`<div class="qrvacio">No se pudo generar el QR. Probá con un link más corto.</div>`;
  }
}

/* Acciones de los botones de la pestaña QR */
const QR_ERR_IMG = "No se pudo generar la imagen. Probá sin logo.";
const qrSlug = () => norm(S.local.nombre||"").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"") || "carta";
function qrDescargar(blob,nombre){
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=nombre;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function qrAccion(a,b){
  if(a==="retry"){ qrActualizar(); return; }
  if(b.getAttribute("aria-disabled")==="true") return;
  const v=validarUrl(S.local.url);
  if(a==="abrir"){ if(v.ok) window.open(v.url,"_blank","noopener,noreferrer"); return; }
  const u=qrUltimo, tam=S.local.qrTam==="chico"?"chico":"grande";
  if(!u||!v.ok||u.url!==v.url||u.tam!==tam){ qrActualizar(); return; }   // la vista previa todavía no está al día
  if(a==="png"){
    try{ u.canvas.toBlob(bl=>{ if(!bl){ toast(QR_ERR_IMG); return; } qrDescargar(bl,`qr-${qrSlug()}.png`); toast("QR descargado"); },"image/png"); }
    catch(err){ toast(QR_ERR_IMG); }
  }
  else if(a==="svg"){ qrDescargar(new Blob([u.svg],{type:"image/svg+xml"}),`qr-${qrSlug()}.svg`); toast("QR descargado"); }
  else if(a==="print") qrImprimir(u);
}

/* Hoja A4 con las tarjetas (2×2 grande, 3×3 chico) y líneas de corte compartidas */
let qrImprimiendo=false, qrAfterPrint=null;   // evita doble toque y guarda el listener de afterprint
/* Deja todo como antes de imprimir: saca la clase, la hoja y el listener */
function qrLimpiarImpresion(){
  if(qrAfterPrint){ window.removeEventListener("afterprint",qrAfterPrint); qrAfterPrint=null; }
  document.body.classList.remove("imprimiendo-qr");
  $("#printArea")?.remove();
  qrImprimiendo=false;
}
async function qrImprimir(u){
  if(qrImprimiendo) return;   // segundo toque mientras se prepara o imprime: se ignora
  qrImprimiendo=true;
  try{ await qrPrepararImpresion(u); }
  catch(err){ qrLimpiarImpresion(); }
}
async function qrPrepararImpresion(u){
  let src;
  try{ src=u.canvas.toDataURL("image/png"); }catch(err){ toast(QR_ERR_IMG); qrLimpiarImpresion(); return; }
  const T=QR_TAMS[u.tam], gw=T.w*T.cols, gh=T.h*T.rows, x0=(210-gw)/2, y0=(297-gh)/2;
  let h=`<style>@page{size:A4;margin:0}</style><div class="hoja"><div class="cab" style="top:${(y0-2.5)/2}mm">${esc(S.local.nombre)} · ${esc(u.corto)} · Recortá por las líneas punteadas.</div>`;
  for(let r=0;r<T.rows;r++) for(let c=0;c<T.cols;c++)
    h+=`<img src="${src}" alt="" style="left:${x0+c*T.w}mm;top:${y0+r*T.h}mm;width:${T.w}mm;height:${T.h}mm">`;
  for(let c=0;c<=T.cols;c++) h+=`<i class="corte cv" style="left:${x0+c*T.w}mm;top:${y0-2}mm;height:${gh+4}mm"></i>`;
  for(let r=0;r<=T.rows;r++) h+=`<i class="corte ch" style="top:${y0+r*T.h}mm;left:${x0-2}mm;width:${gw+4}mm"></i>`;
  h+=`</div>`;
  if(qrAfterPrint){ window.removeEventListener("afterprint",qrAfterPrint); qrAfterPrint=null; }
  $("#printArea")?.remove();   // por si quedó una hoja de una impresión anterior
  const pa=document.createElement("div"); pa.id="printArea"; pa.innerHTML=h; document.body.appendChild(pa);
  toast("Abriendo impresión…");
  await Promise.all([...pa.querySelectorAll("img")].map(im=>im.complete?null:new Promise(r=>{im.onload=im.onerror=r})));
  qrAfterPrint=()=>qrLimpiarImpresion();
  window.addEventListener("afterprint",qrAfterPrint);
  document.body.classList.add("imprimiendo-qr");   // recién ahora el @media print muestra solo la hoja
  window.print();
}

/* ---------- Eventos del panel ---------- */
const PN=$("#panel");
const ESTRUCTURA = ["formato","pri","bg","card","txt","fb","ft","r","efecto","layout"];
PN.addEventListener("input",e=>{
  const t=e.target;
  if(t.hasAttribute("data-code")){
    clearTimeout(codeT); codeT=setTimeout(()=>aplicarCodigo(t.value),280); return;
  }
  if(t.dataset.path==="local.url"){
    // Link del QR: no se re-renderiza el panel (se perdería el foco), solo estado + vista previa con debounce
    S.local.url=t.value; save(); qrProgramar(); return;
  }
  if(t.dataset.path){
    const v=t.type==="checkbox"?t.checked:t.type==="range"?+t.value:t.value;
    setPath(t.dataset.path,v);
    if(t.dataset.path==="estilo.r") $("#rv").textContent=v+"px";
    if(ESTRUCTURA.includes(t.dataset.path.split(".")[1])){ S.estilo.tema=null; $$(".tema").forEach(x=>x.classList.remove("on")); }
  } else if(t.dataset.pid&&t.dataset.f){
    const p=S.productos.find(x=>x.id===t.dataset.pid), f=t.dataset.f;
    p[f]=t.type==="checkbox"?t.checked:(f==="precio"||f==="precioAntes")?(+t.value||0):t.value;
    const sm=t.closest("details")?.querySelector("summary");
    if(sm&&["nombre","precio","emoji"].includes(f)){sm.querySelector(".n").textContent=p.nombre;sm.querySelector(".p").textContent=fmt(p.precio);sm.querySelector(".e").textContent=p.emoji}
    if(["cat","stock","destacado"].includes(f)) renderPanel();
  } else if(t.dataset.cat){
    S.categorias.find(c=>c.id===t.dataset.cat)[t.dataset.cf]=t.value;
  } else return;
  renderMenu({instant:true}); save();
});
PN.addEventListener("change",async e=>{
  const t=e.target;
  if(t.dataset.pid&&t.dataset.f==="precioAntes") renderPanel();
  if(!t.dataset.upload||!t.files[0]) return;
  try{
    const url=await resizeImg(t.files[0], t.dataset.upload==="logo"?300:640);
    if(t.dataset.upload==="logo") S.local.logo=url; else S.productos.find(p=>p.id===t.dataset.upload).foto=url;
    renderPanel();renderMenu({instant:true});save();toast("📷 Foto actualizada");
  }catch(err){toast("No se pudo leer la imagen")}
});
PN.addEventListener("toggle",e=>{if(e.target.matches("details.prod")&&e.target.open)openProd=e.target.dataset.pid},true);
PN.addEventListener("click",async e=>{
  const b=e.target.closest("button"); if(!b) return;
  const d=b.dataset, prev=armed; armed=null;
  if(d.qr){ qrAccion(d.qr,b); return; }
  if(d.qrtam){
    S.local.qrTam=d.qrtam==="chico"?"chico":"grande";
    b.parentNode.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));
    save(); qrActualizar(); return;
  }
  if(d.export!==undefined){
    const code=genCodigo(); const ta=PN.querySelector("[data-code]"); ta.value=code; aplicarCodigo(code,{silent:true});
    try{ await navigator.clipboard.writeText(code); toast("📋 Código copiado"); }catch(err){ ta.focus(); ta.select(); toast("Código generado: copialo del recuadro"); }
    return;
  }
  if(d.tema){
    const code=d.tema.toUpperCase(); const ta=PN.querySelector("[data-code]"); if(ta) ta.value=code;
    aplicarCodigo(code,{silent:true}); toast("🎨 "+CODIGOS[d.tema].nombre); return;
  }
  if(d.formato){S.estilo.formato=d.formato;S.estilo.tema=null}
  else if(d.efecto){S.estilo.efecto=d.efecto;S.estilo.tema=null}
  else if(d.layout){S.estilo.layout=d.layout}
  else if(d.quitar){if(d.quitar==="logo")S.local.logo=null;else S.productos.find(p=>p.id===d.quitar).foto=null}
  else if(d.addprod){const p=P(d.addprod,"Nuevo producto","",0,"🍽️");S.productos.push(p);openProd=p.id;toast("Producto agregado")}
  else if(d.addcat!==undefined){S.categorias.push({id:"c"+(uid++),nombre:"Nueva categoría",emoji:"📋"});toast("Categoría creada")}
  else if(d.delprod){if(prev==="p"+d.delprod){S.productos=S.productos.filter(p=>p.id!==d.delprod);toast("Producto eliminado")}else armed="p"+d.delprod}
  else if(d.delcat){if(prev==="cat"+d.delcat){S.categorias=S.categorias.filter(c=>c.id!==d.delcat);S.productos=S.productos.filter(p=>p.cat!==d.delcat);toast("Categoría eliminada")}else armed="cat"+d.delcat}
  else if(d.reset!==undefined){if(prev==="reset"){S=clone(DEF);lastFb="";toast("Demo restablecida")}else armed="reset"}
  else return;
  renderPanel();renderMenu({instant:true});save();
});

/* =========================================================
   ARRANQUE
   ========================================================= */
uid = Math.max(uid, ...S.productos.map(p=>+p.id.slice(1)||0), ...S.categorias.map(c=>+c.id.slice(1)||0)) + 1;
renderMenu();
</script>
